---
# Deploy a persistent SSH keypair for the foreman user to authenticate to
# GitLab. Stored in Vault (not generated per-host) so the same public key
# survives host rebuilds — a rebuilt host would otherwise get a fresh
# keypair every time, requiring the GitLab deploy key to be re-registered
# after every rebuild.
- name: templates - ensure foreman .ssh directory exists
  become: true
  ansible.builtin.file:
    path: /usr/share/foreman/.ssh
    state: directory
    owner: foreman
    group: foreman
    mode: "0700"

- name: templates - deploy persistent SSH private key for foreman → GitLab
  become: true
  ansible.builtin.copy:
    content: "{{ vault_foreman_template_sync_ssh_private_key }}\n"
    dest: /usr/share/foreman/.ssh/id_ed25519
    owner: foreman
    group: foreman
    mode: "0600"
  no_log: true

- name: templates - deploy persistent SSH public key for foreman → GitLab
  become: true
  ansible.builtin.copy:
    content: "{{ vault_foreman_template_sync_ssh_public_key }}\n"
    dest: /usr/share/foreman/.ssh/id_ed25519.pub
    owner: foreman
    group: foreman
    mode: "0644"

# Scan and trust the GitLab host key
- name: templates - scan GitLab host keys
  become: false
  ansible.builtin.shell:
    cmd: >
      ssh-keyscan {{ foreman_template_gitlab_host }}
      | grep -v '^#'
  register: foreman_gitlab_host_keys
  changed_when: false

- name: templates - add GitLab host keys to foreman known_hosts
  become: true
  ansible.builtin.known_hosts:
    path: /usr/share/foreman/.ssh/known_hosts
    name: "{{ foreman_template_gitlab_host }}"
    key: "{{ item }}"
  loop: "{{ foreman_gitlab_host_keys.stdout_lines }}"

# The known_hosts module writes the file as root — the foreman user (which
# runs the git fetch for template sync) must be able to read it.
- name: templates - fix known_hosts ownership
  become: true
  ansible.builtin.file:
    path: /usr/share/foreman/.ssh/known_hosts
    owner: foreman
    group: foreman
    mode: "0644"

# Apply template sync settings
- name: templates - configure template sync settings
  become: false
  theforeman.foreman.setting:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  loop: "{{ foreman_template_settings | default([]) }}"

# Trigger template import from GitLab
- name: templates - import templates from GitLab
  become: false
  theforeman.foreman.templates_import:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    associate: "{{ foreman_template_import_associate | default('always') }}"
    branch: "{{ foreman_template_import_branch | default('main') }}"
    dirname: "{{ foreman_template_import_dirname | default('/') }}"
    filter: "{{ foreman_template_import_filter | default(omit) }}"
    force: "{{ foreman_template_import_force | default(false) }}"
    repo: "{{ foreman_template_repo }}"
