---
- name: lifecycle - create lifecycle environments
  become: false
  theforeman.foreman.lifecycle_environment:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    name: "{{ item.name }}"
    prior: "{{ item.prior | default(omit) }}"
    label: "{{ item.label | default(omit) }}"
    organization: "{{ item.org | default(foreman_org) }}"
    description: "{{ item.description | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ foreman_lifecycle_envs | default([]) }}"

- name: lifecycle - create content views
  become: false
  theforeman.foreman.content_view:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    name: "{{ item.name }}"
    description: "{{ item.description | default(omit) }}"
    organization: "{{ item.org | default(foreman_org) }}"
    auto_publish: "{{ item.auto_publish if (item.composite | default(false) | bool and item.auto_publish is defined) else omit }}"
    solve_dependencies: "{{ item.solve_dependencies | default(omit) }}"
    repositories: "{{ item.repos | default(omit) }}"
    components: "{{ item.components | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ foreman_content_views | default([]) }}"

# content_view_version's `version: "1.0"` promote is not idempotent past the
# first publish: it looks up version 1.0 specifically and force-promotes it
# into every environment that doesn't currently hold *that exact version* —
# including ones a later publish already moved forward. Left gated only on
# `first_publish`, a re-run after subsequent versions exist reverts every
# environment back to 1.0. So check for an existing version first and skip
# the publish/promote once the content view has one, regardless of the flag.
- name: lifecycle - check for existing content view versions
  become: false
  theforeman.foreman.content_view_version_info:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    content_view: "{{ item.name }}"
    organization: "{{ item.org | default(foreman_org) }}"
  register: _foreman_cv_versions
  loop: "{{ foreman_content_views | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.first_publish | default(false) | bool

- name: lifecycle - initial publish and promote content views
  become: false
  theforeman.foreman.content_view_version:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    content_view: "{{ item.item.name }}"
    organization: "{{ item.item.org | default(foreman_org) }}"
    lifecycle_environments: "{{ item.item.lifecycle_envs }}"
    version: "1.0"
  loop: "{{ _foreman_cv_versions.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.item.first_publish | default(false) | bool
    - (item.content_view_versions | default([]) | length) == 0

- name: lifecycle - create activation keys
  become: false
  theforeman.foreman.activation_key:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    name: "{{ item.name }}"
    new_name: "{{ item.new_name | default(omit) }}"
    description: "{{ item.description | default(omit) }}"
    organization: "{{ item.org | default(foreman_org) }}"
    lifecycle_environment: "{{ item.lifecycle_env | default(omit) }}"
    content_view: "{{ item.content_view }}"
    host_collections: "{{ item.host_collections | default(omit) }}"
    content_overrides: "{{ item.content_overrides | default(omit) }}"
    auto_attach: "{{ item.auto_attach | default(false) }}"
    release_version: "{{ item.release_version | default(omit) }}"
    service_level: "{{ item.service_level | default(omit) }}"
    max_hosts: "{{ item.max_hosts | default(omit) }}"
    unlimited_hosts: "{{ item.unlimited_hosts | default(true) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ foreman_activation_keys | default([]) }}"
