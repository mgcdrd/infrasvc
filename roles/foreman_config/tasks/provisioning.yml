---
# Pass 1: create OSes without template/media associations (they may not exist yet)
- name: provisioning - create Debian operating systems
  become: false
  theforeman.foreman.operatingsystem:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    name: "{{ item.name }}"
    release_name: "{{ item.release_name }}"
    family: Debian
    major: "{{ item.major }}"
    architectures: "{{ item.architectures | default(foreman_architectures | map(attribute='name') | list) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ foreman_operatingsystems_deb | default([]) }}"

- name: provisioning - create RHEL-family operating systems (pass 1 - no templates)
  become: false
  theforeman.foreman.operatingsystem:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    name: "{{ item.name }}"
    family: Redhat
    major: "{{ item.major }}"
    architectures: "{{ item.architectures | default(foreman_architectures | map(attribute='name') | list) }}"
    ptables: "{{ item.partition_tables | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ foreman_operatingsystems_rh | default([]) }}"

- name: provisioning - create installation media
  become: false
  theforeman.foreman.installation_medium:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    name: "{{ item.name }}"
    os_family: "{{ item.os_family | default('Redhat') }}"
    operatingsystems: "{{ item.operatingsystems | default(omit) }}"
    path: "{{ item.path }}"
    locations: "{{ item.locations | default([foreman_location]) }}"
    organizations: "{{ item.organizations | default([foreman_org]) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ foreman_installation_media | default([]) }}"

# Pass 2: re-apply RHEL OSes with template and media associations now that
# they exist. provisioning_templates in vars is a kind → template map; the
# operatingsystem module takes a flat list of template names.
- name: provisioning - associate templates and media to RHEL-family operating systems
  become: false
  theforeman.foreman.operatingsystem:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    name: "{{ item.name }}"
    family: Redhat
    major: "{{ item.major }}"
    architectures: "{{ item.architectures | default(foreman_architectures | map(attribute='name') | list) }}"
    ptables: "{{ item.partition_tables | default(omit) }}"
    media: "{{ item.install_media | default(omit) }}"
    provisioning_templates: "{{ (item.provisioning_templates.values() | list) if item.provisioning_templates is defined else omit }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ foreman_operatingsystems_rh | default([]) }}"

# Selecting the default template per kind is a separate resource — flatten
# each OS's kind → template map into (os, kind, template) tuples.
- name: provisioning - build OS default template list
  become: false
  ansible.builtin.set_fact:
    _foreman_os_default_templates: >-
      {%- set out = [] -%}
      {%- for os in foreman_operatingsystems_rh | default([]) if os.provisioning_templates is defined -%}
      {%- for kind, tpl in os.provisioning_templates.items() -%}
      {%- set _ = out.append({'os': os.name ~ ' ' ~ os.major, 'kind': kind, 'template': tpl}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: provisioning - set OS default templates
  become: false
  theforeman.foreman.os_default_template:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    operatingsystem: "{{ item.os }}"
    template_kind: "{{ item.kind }}"
    provisioning_template: "{{ item.template }}"
    state: present
  loop: "{{ _foreman_os_default_templates }}"
  loop_control:
    label: "{{ item.os }} / {{ item.kind }}"

# hammer has no stored credentials by default — pass them explicitly.
# The password rides in the environment: results never include it, so
# failures stay diagnosable without no_log. Retries cover transient API
# errors right after heavy template/OS operations.
- name: provisioning - associate partition tables to OS families via hammer
  become: true
  ansible.builtin.shell:
    cmd: >
      hammer -u "{{ foreman_username }}" -p "$HAMMER_PASSWORD"
      partition-table update
      --name "{{ item.name }}"
      --os-family "{{ item.family }}"
  environment:
    HAMMER_PASSWORD: "{{ vault_foreman_admin_password }}"
  loop: "{{ foreman_partition_table_os_families | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: _foreman_ptable_update
  retries: 3
  delay: 10
  until: _foreman_ptable_update.rc == 0
  changed_when: true

- name: provisioning - set global parameters
  become: false
  theforeman.foreman.global_parameter:
    username: "{{ foreman_username }}"
    password: "{{ vault_foreman_admin_password }}"
    server_url: "{{ foreman_url }}"
    validate_certs: "{{ foreman_validate_certs }}"
    name: "{{ item.name }}"
    parameter_type: "{{ item.type | default('string') }}"
    value: "{{ item.value }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ foreman_global_parameters | default([]) }}"
