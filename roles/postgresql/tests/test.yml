---

- hosts: all
  gather_facts: true
  become: true
  roles:
    - mgcdrd.infrabase.postgresql
  vars:
    postgresql_version: "18"
    postgresql_listen_addresses: "localhost"
    postgresql_hba_entries:
      - { type: local, database: all, user: all, method: peer }
      - { type: host, database: all, user: all, address: "127.0.0.1/32", method: scram-sha-256 }
      - { type: host, database: keycloak, user: keycloak, address: "10.0.0.0/24", method: scram-sha-256 }
    postgresql_roles:
      - name: keycloak
        password: "{{ vault_keycloak_db_password | default('changeme') }}"
        role_attr_flags: LOGIN
    postgresql_databases:
      - name: keycloak
        owner: keycloak
