---

- name: ipa_baseline ipa_setup - Generate enrollment password
  ansible.builtin.set_fact:
    _ipa_baseline_new_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_lowercase,ascii_uppercase,digits') }}"
  no_log: true

- name: ipa_baseline ipa_setup - Authenticate to IPA as admin
  ansible.builtin.uri:
    url: "https://{{ ipa_baseline_server }}/ipa/session/login_password"
    method: POST
    body: "user={{ ipa_baseline_admin_principal | urlencode }}&password={{ vault_ipa_admin_password | urlencode }}"
    headers:
      Content-Type: "application/x-www-form-urlencoded"
      Referer: "https://{{ ipa_baseline_server }}/ipa"
    validate_certs: "{{ ipa_baseline_validate_certs }}"
    status_code: 200
  register: _ipa_session
  no_log: true

# ---- Role ----

- name: ipa_baseline ipa_setup - Check enrollment role exists
  ansible.builtin.uri:
    url: "https://{{ ipa_baseline_server }}/ipa/json"
    method: POST
    body_format: json
    body:
      method: role_show
      params:
        - ["{{ ipa_baseline_enrollment_role }}"]
        - {}
      id: 0
    headers:
      Cookie: "ipa_session={{ _ipa_session.cookies.ipa_session }}"
      Referer: "https://{{ ipa_baseline_server }}/ipa"
    validate_certs: "{{ ipa_baseline_validate_certs }}"
    status_code: 200
  register: _ipa_role_check
  changed_when: false
  failed_when: >-
    _ipa_role_check.json.error is not none and
    _ipa_role_check.json.error.code != 4001

- name: ipa_baseline ipa_setup - Create enrollment role
  ansible.builtin.uri:
    url: "https://{{ ipa_baseline_server }}/ipa/json"
    method: POST
    body_format: json
    body:
      method: role_add
      params:
        - ["{{ ipa_baseline_enrollment_role }}"]
        - description: "Allows Ansible to pre-register hosts for IPA client enrollment"
      id: 0
    headers:
      Cookie: "ipa_session={{ _ipa_session.cookies.ipa_session }}"
      Referer: "https://{{ ipa_baseline_server }}/ipa"
    validate_certs: "{{ ipa_baseline_validate_certs }}"
    status_code: 200
  register: _ipa_role_create
  when: _ipa_role_check.json.error is not none and _ipa_role_check.json.error.code == 4001
  failed_when: _ipa_role_create.json.error is not none

# Idempotent — IPA returns success even when privilege is already assigned
- name: ipa_baseline ipa_setup - Assign Host Enrollment privilege to role
  ansible.builtin.uri:
    url: "https://{{ ipa_baseline_server }}/ipa/json"
    method: POST
    body_format: json
    body:
      method: role_add_privilege
      params:
        - ["{{ ipa_baseline_enrollment_role }}"]
        - privilege:
            - "Host Enrollment"
      id: 0
    headers:
      Cookie: "ipa_session={{ _ipa_session.cookies.ipa_session }}"
      Referer: "https://{{ ipa_baseline_server }}/ipa"
    validate_certs: "{{ ipa_baseline_validate_certs }}"
    status_code: 200
  register: _ipa_priv_assign
  failed_when: _ipa_priv_assign.json.error is not none

# ---- Service Account ----

- name: ipa_baseline ipa_setup - Check service account exists
  ansible.builtin.uri:
    url: "https://{{ ipa_baseline_server }}/ipa/json"
    method: POST
    body_format: json
    body:
      method: user_show
      params:
        - ["{{ ipa_baseline_enrollment_principal }}"]
        - {}
      id: 0
    headers:
      Cookie: "ipa_session={{ _ipa_session.cookies.ipa_session }}"
      Referer: "https://{{ ipa_baseline_server }}/ipa"
    validate_certs: "{{ ipa_baseline_validate_certs }}"
    status_code: 200
  register: _ipa_user_check
  changed_when: false
  failed_when: >-
    _ipa_user_check.json.error is not none and
    _ipa_user_check.json.error.code != 4001

# krbPasswordExpiration is set to a far-future date so the account is not
# subject to the forced password-change-on-first-login that IPA applies
# when an admin sets a password via user_add.
- name: ipa_baseline ipa_setup - Create service account
  ansible.builtin.uri:
    url: "https://{{ ipa_baseline_server }}/ipa/json"
    method: POST
    body_format: json
    body:
      method: user_add
      params:
        - ["{{ ipa_baseline_enrollment_principal }}"]
        - givenname: "Ansible"
          sn: "Enrollment"
          userpassword: "{{ _ipa_baseline_new_password }}"
          noprivate: true
          setattr:
            - "krbPasswordExpiration=20491231235959Z"
      id: 0
    headers:
      Cookie: "ipa_session={{ _ipa_session.cookies.ipa_session }}"
      Referer: "https://{{ ipa_baseline_server }}/ipa"
    validate_certs: "{{ ipa_baseline_validate_certs }}"
    status_code: 200
  register: _ipa_user_create
  no_log: true
  when: _ipa_user_check.json.error is not none and _ipa_user_check.json.error.code == 4001
  failed_when: _ipa_user_create.json.error is not none

- name: ipa_baseline ipa_setup - Rotate service account password
  ansible.builtin.uri:
    url: "https://{{ ipa_baseline_server }}/ipa/json"
    method: POST
    body_format: json
    body:
      method: user_mod
      params:
        - ["{{ ipa_baseline_enrollment_principal }}"]
        - userpassword: "{{ _ipa_baseline_new_password }}"
          setattr:
            - "krbPasswordExpiration=20491231235959Z"
      id: 0
    headers:
      Cookie: "ipa_session={{ _ipa_session.cookies.ipa_session }}"
      Referer: "https://{{ ipa_baseline_server }}/ipa"
    validate_certs: "{{ ipa_baseline_validate_certs }}"
    status_code: 200
  register: _ipa_user_rotate
  no_log: true
  when: ipa_baseline_force_rotate | bool and _ipa_user_check.json.error is none
  failed_when: _ipa_user_rotate.json.error is not none

# Idempotent — IPA reports completed=0 but no error when member already present
- name: ipa_baseline ipa_setup - Add service account to enrollment role
  ansible.builtin.uri:
    url: "https://{{ ipa_baseline_server }}/ipa/json"
    method: POST
    body_format: json
    body:
      method: role_add_member
      params:
        - ["{{ ipa_baseline_enrollment_role }}"]
        - user:
            - "{{ ipa_baseline_enrollment_principal }}"
      id: 0
    headers:
      Cookie: "ipa_session={{ _ipa_session.cookies.ipa_session }}"
      Referer: "https://{{ ipa_baseline_server }}/ipa"
    validate_certs: "{{ ipa_baseline_validate_certs }}"
    status_code: 200
  register: _ipa_member_add
  failed_when: _ipa_member_add.json.error is not none
