---

- name: ipa_baseline vault_write - Store enrollment credentials in Vault
  ansible.builtin.uri:
    url: "{{ ipa_baseline_vault_url }}/v1/{{ ipa_baseline_vault_kv_mount }}/data/{{ ipa_baseline_vault_enrollment_path }}"
    method: POST
    headers:
      X-Vault-Token: "{{ ipa_baseline_vault_token }}"
    body_format: json
    body:
      data:
        principal: "{{ ipa_baseline_enrollment_principal }}"
        password: "{{ _ipa_baseline_new_password }}"
    status_code: [200, 204]
  no_log: true
