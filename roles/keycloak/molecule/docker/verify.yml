---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Compose file was rendered
      ansible.builtin.stat:
        path: /srv/docker/keycloak/docker-compose.yml
      register: _compose

    - name: Compose file exists
      ansible.builtin.assert:
        quiet: true
        that:
          - _compose.stat.exists

    - name: Inspect the Keycloak container
      community.docker.docker_container_info:
        name: keycloak
      register: _kc_info

    - name: Container is running
      ansible.builtin.assert:
        quiet: true
        that:
          - _kc_info.exists
          - _kc_info.container.State.Status == 'running'

    - name: Health endpoint answers on the management port
      ansible.builtin.uri:
        url: https://localhost:9000/health/ready
        validate_certs: false
        status_code: 200
      register: _health
      retries: 20
      delay: 6
      until: _health.status == 200
