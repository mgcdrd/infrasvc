---

- name: keycloak install-docker - Install Docker
  ansible.builtin.include_role:
    name: mgcdrd.infrabase.docker

# Resolve the data root once so all subsequent tasks and the compose
# template use a single consistent path regardless of storage mode.
- name: keycloak install-docker - Set data root fact
  ansible.builtin.set_fact:
    _keycloak_data_dir: >-
      {{ keycloak_nfs_mount if keycloak_shared_storage == 'nfs'
         else keycloak_base_dir + '/data' }}

- name: keycloak install-docker - Mount shared NFS volume
  ansible.builtin.import_tasks: nfs.yml
  when: keycloak_shared_storage == 'nfs'

- name: keycloak install-docker - Create local data directories
  ansible.builtin.file:
    path:  "{{ _keycloak_data_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode:  "0755"
  loop: "{{ keycloak_data_subdirs }}"
  when: keycloak_shared_storage == 'local'

- name: keycloak install-docker - Open Keycloak ports in firewalld
  ansible.posix.firewalld:
    port:      "{{ item }}/tcp"
    permanent: true
    state:     enabled
    immediate: true
  loop:
    - "{{ keycloak_http_port }}"
    - "{{ keycloak_https_port }}"
    - "{{ keycloak_mgmt_port }}"
    - "{{ keycloak_jgroups_port }}"
    - "{{ keycloak_jgroups_fd_port }}"
  when: keycloak_network_mode == 'host'

- name: keycloak install-docker - Forward privileged ports to Keycloak bind ports
  ansible.posix.firewalld:
    rich_rule: "rule family=ipv4 forward-port port={{ item.from }} protocol=tcp to-port={{ item.to }}"
    permanent: true
    state:     enabled
    immediate: true
  loop:
    - { from: "80", to: "{{ keycloak_http_port }}" }
    - { from: "443", to: "{{ keycloak_https_port }}" }
  when: keycloak_network_mode == 'host'

- name: keycloak install-docker - Issue TLS certificate
  ansible.builtin.import_tasks: tls.yml

- name: keycloak install-docker - Set cert directory ownership for the container
  ansible.builtin.file:
    path:    "{{ keycloak_cert_dir }}"
    state:   directory
    owner:   "1000"
    group:   "1000"
    recurse: true
  when: keycloak_manage_tls | bool

- name: keycloak install-docker - Deploy Keycloak
  ansible.builtin.import_tasks: deploy-docker.yml
