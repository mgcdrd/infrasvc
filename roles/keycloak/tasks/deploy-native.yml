---

- name: keycloak deploy-native - Create the environment directory
  ansible.builtin.file:
    path:  /etc/keycloak
    state: directory
    owner: root
    group: "{{ keycloak_service_group }}"
    mode:  "0750"

- name: keycloak deploy-native - Deploy keycloak.conf
  ansible.builtin.template:
    src:   keycloak.conf.j2
    dest:  "{{ keycloak_install_dir }}/conf/keycloak.conf"
    owner: root
    group: "{{ keycloak_service_group }}"
    mode:  "0640"
  no_log: true
  notify: keycloak native build

- name: keycloak deploy-native - Deploy the bootstrap admin environment file
  ansible.builtin.template:
    src:   keycloak.env.j2
    dest:  /etc/keycloak/keycloak.env
    owner: root
    group: "{{ keycloak_service_group }}"
    mode:  "0640"
  no_log: true

- name: keycloak deploy-native - Deploy the systemd unit
  ansible.builtin.template:
    src:   keycloak.service.j2
    dest:  "/etc/systemd/system/{{ keycloak_service_name }}.service"
    owner: root
    group: root
    mode:  "0644"
  notify: keycloak native restart

# The version symlink and keycloak.conf both notify 'keycloak native build'
# (which chains into 'keycloak native restart'). Flushing here means a fresh
# install or any config change is compiled with kc.sh build before the
# service is (re)started below. A run with no changes builds nothing.
- name: keycloak deploy-native - Apply pending build and restart
  ansible.builtin.meta: flush_handlers

- name: keycloak deploy-native - Enable and start Keycloak
  ansible.builtin.systemd_service:
    name:          "{{ keycloak_service_name }}"
    state:         started
    enabled:       true
    daemon_reload: true

- name: keycloak deploy-native - Wait for the health endpoint
  ansible.builtin.uri:
    url:            "https://localhost:{{ keycloak_mgmt_port }}/health/ready"
    validate_certs: false
    status_code:    200
  register: _keycloak_health
  until:    _keycloak_health.status == 200
  retries:  30
  delay:    10
