---

# ---- GLOBAL BLOCK ----
# Settings for the haproxy 'global' section.
# See vars/main.yml or README for full structure.
haproxy_global: {}

# ---- DEFAULTS BLOCKS ----
# List of haproxy 'defaults' blocks.
haproxy_defaults: []

# ---- MAILERS BLOCKS ----
# List of haproxy 'mailers' blocks.
haproxy_mailers: []

# ---- RESOLVERS BLOCKS ----
# List of haproxy 'resolvers' blocks.
haproxy_resolvers: []

# ---- FRONTEND BLOCKS ----
# List of haproxy 'frontend' blocks.
haproxy_frontends: []

# ---- BACKEND BLOCKS ----
# List of haproxy 'backend' blocks.
haproxy_backends: []

# ---- ADDITIONAL FILES ----
# List of extra files to hard-link into place before haproxy starts.
haproxy_additional: []

# ---- SELINUX (RedHat only) ----
# Without this, SELinux blocks haproxy from connecting to backend servers on
# non-standard ports (e.g. proxying to a backend on a port with no matching
# SELinux port type). No-op on Debian and on RedHat hosts with SELinux
# disabled.
haproxy_selinux_connect_any: true
