---

- name: Test grafana_alloy role
  hosts: all
  gather_facts: true
  become: true
  roles:
    - mgcdrd.infrasvc.grafana_alloy
  vars:
    grafana_alloy_remote_write_url: "http://prometheus.example.com:9090/api/v1/write"
    grafana_alloy_nginx_stub_status_uri: "http://127.0.0.1/nginx_status"
    grafana_alloy_extra_labels:
      env: test
