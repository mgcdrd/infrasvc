---

# ---- GCP ----

# GCP project ID that owns the Public CA external account key. Required.
google_publicca_eab_project: ""

# Full Vault path (mount included) that returns a short-lived GCP OAuth
# access token from the Vault GCP secrets engine. Required. The token is
# handed to gcloud in-memory via CLOUDSDK_AUTH_ACCESS_TOKEN — no key file
# is ever written. The roleset/static account behind it needs the Public
# CA External Account Key Creator role
# (roles/publicca.externalAccountKeyCreator) on the project, e.g.:
#   google_publicca_eab_vault_gcp_token_path: "gcp/roleset/publicca-eab/token"
#   google_publicca_eab_vault_gcp_token_path: "gcp/static-account/publicca-eab/token"
google_publicca_eab_vault_gcp_token_path: ""

# ---- ACCOUNT ----

# Label for the ACME account this key will register. Used only to build a
# per-account Vault path (see below) — never passed to gcloud.
#
# A Google Public CA EAB key is single-use: it registers exactly one ACME
# account and is invalidated immediately after, and it expires unused
# after 7 days. Never point two hosts/accounts at the same Vault path —
# each registration needs its own freshly minted key.
google_publicca_eab_account_name: "{{ inventory_hostname }}"

# ---- VAULT (GCP token source + write destination) ----

# HashiCorp Vault address (used for both the GCP token read above and the
# KV write below), KV mount, and full KV path to write kid/hmac_key to.
# All three required. The path is not built from
# account_name automatically — compose it explicitly at the deployment
# layer so it's obvious what consumes it, e.g.:
#   google_publicca_eab_vault_path: "{{ vault_kv_env }}/acme/google/{{ google_publicca_eab_account_name }}"
google_publicca_eab_vault_addr: ""
google_publicca_eab_vault_kv_mount: ""
google_publicca_eab_vault_path: ""
