---

- name: ipa_service_account manager_vault_read - Read manager credentials
  ansible.builtin.uri:
    url: "{{ ipa_service_account_vault_url }}/v1/{{ ipa_service_account_vault_kv_mount }}/data/{{ ipa_service_account_vault_manager_path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ ipa_service_account_vault_token }}"
    status_code: 200
  register: _ipa_svc_manager_read
  no_log: true

- name: ipa_service_account manager_vault_read - Set manager password fact
  ansible.builtin.set_fact:
    _ipa_svc_manager_password: "{{ _ipa_svc_manager_read.json.data.data.password }}"
  no_log: true
