---

- name: ipa_service_account manager_vault_write - Store manager credentials in Vault
  ansible.builtin.uri:
    url: "{{ ipa_service_account_vault_url }}/v1/{{ ipa_service_account_vault_kv_mount }}/data/{{ ipa_service_account_vault_manager_path }}"
    method: POST
    headers:
      X-Vault-Token: "{{ ipa_service_account_vault_token }}"
    body_format: json
    body:
      data:
        principal: "{{ ipa_service_account_manager_principal }}"
        password: "{{ _ipa_svc_manager_new_password }}"
    status_code: [200, 204]
  no_log: true

- name: ipa_service_account manager_vault_write - Use freshly generated password for this run
  ansible.builtin.set_fact:
    _ipa_svc_manager_password: "{{ _ipa_svc_manager_new_password }}"
  no_log: true
