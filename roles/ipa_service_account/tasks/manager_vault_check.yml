---

- name: ipa_service_account manager_vault_check - Check for existing manager credentials
  ansible.builtin.uri:
    url: "{{ ipa_service_account_vault_url }}/v1/{{ ipa_service_account_vault_kv_mount }}/data/{{ ipa_service_account_vault_manager_path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ ipa_service_account_vault_token }}"
    status_code: [200, 404]
  register: _ipa_svc_manager_check
  no_log: true
  changed_when: false

- name: ipa_service_account manager_vault_check - Set manager existence fact
  ansible.builtin.set_fact:
    _ipa_svc_manager_exists: "{{ _ipa_svc_manager_check.status == 200 }}"
