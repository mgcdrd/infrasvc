---

- name: ipa_service_account preflight - Assert required variables are set
  ansible.builtin.assert:
    that:
      - ipa_service_account_server | length > 0
      - ipa_service_account_fqdn | length > 0
      - ipa_service_account_vault_url | length > 0
      - ipa_service_account_vault_path | length > 0
    fail_msg: >-
      ipa_service_account_server, ipa_service_account_fqdn,
      ipa_service_account_vault_url, and ipa_service_account_vault_path
      must all be set.

- name: ipa_service_account preflight - Verify IPA server is reachable
  ansible.builtin.uri:
    url: "https://{{ ipa_service_account_server }}/ipa/ui/"
    method: GET
    validate_certs: "{{ ipa_service_account_validate_certs }}"
    status_code: 200
  changed_when: false

- name: ipa_service_account preflight - Verify Vault is reachable
  ansible.builtin.uri:
    url: "{{ ipa_service_account_vault_url }}/v1/sys/health"
    method: GET
    status_code: [200, 429, 472, 473]
  changed_when: false
