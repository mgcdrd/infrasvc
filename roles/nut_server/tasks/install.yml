---

- name: nut_server install - Install NUT server + client (Debian)
  ansible.builtin.apt:
    pkg:
      - nut-server
      - nut-client
    state: latest
    update_cache: true
  notify:
    - nut_server restart driver enumerator
    - nut_server restart upsd
  when: ansible_facts['os_family'] == 'Debian'

- name: nut_server install - Enable EPEL (RedHat)
  ansible.builtin.dnf:
    name:  epel-release
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: nut_server install - Install NUT server + client (RedHat)
  ansible.builtin.dnf:
    name:
      - nut
      - nut-client
    state: latest
  notify:
    - nut_server restart driver enumerator
    - nut_server restart upsd
  when: ansible_facts['os_family'] == 'RedHat'
