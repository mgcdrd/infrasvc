---
# Run before repo configuration to ensure the host is in a clean state.
# Handles systems previously enrolled with a Foreman/Katello instance.

# A host registered as a content host of another Foreman/Katello carries
# rhsm CA config and content-view repos that conflict with becoming a
# Katello server itself. Unregister before anything else.
- name: preflight - check for existing subscription-manager registration
  become: true
  ansible.builtin.shell:
    cmd: subscription-manager identity
  register: foreman_subman_identity
  changed_when: false
  failed_when: false

# clean runs even if unregister fails (old server unreachable) — it wipes
# the local rhsm state either way.
- name: preflight - unregister from previous Katello server
  become: true
  ansible.builtin.shell:
    cmd: subscription-manager unregister; subscription-manager clean
  when: foreman_subman_identity.rc == 0

- name: preflight - check for katello CA consumer package
  become: false
  ansible.builtin.shell:
    cmd: rpm -q --whatprovides katello-ca-consumer
  register: foreman_katello_pkg
  changed_when: false
  failed_when: false

- name: preflight - remove katello CA consumer package
  become: true
  ansible.builtin.dnf:
    name: "katello-ca-consumer*"
    state: absent
  when: foreman_katello_pkg.rc == 0

- name: preflight - check if subscription-manager DNF plugin config exists
  become: false
  ansible.builtin.stat:
    path: /etc/dnf/plugins/subscription-manager.conf
  register: foreman_subman_plugin_stat

- name: preflight - disable subscription-manager DNF plugin
  become: true
  community.general.ini_file:
    path: /etc/dnf/plugins/subscription-manager.conf
    section: main
    option: enabled
    value: "0"
    mode: "0644"
  when: foreman_subman_plugin_stat.stat.exists

- name: preflight - re-enable standard Rocky repos
  become: true
  ansible.builtin.shell:
    cmd: dnf config-manager --enable baseos appstream extras crb
  changed_when: true
  when: foreman_katello_pkg.rc == 0 or foreman_subman_identity.rc == 0

# Some kickstart profiles install the stock EPEL/Fedora `puppet` package by
# default (pre-OpenVox convention). It ships /usr/lib/systemd/system/puppet.service,
# which conflicts with openvox-agent's copy of the same file and aborts the
# packages.yml transaction. openvox-agent supersedes it entirely — the two
# must never coexist.
- name: preflight - check for conflicting EPEL/Fedora puppet package
  become: false
  ansible.builtin.shell:
    cmd: rpm -q puppet
  register: foreman_stray_puppet_pkg
  changed_when: false
  failed_when: false

- name: preflight - remove conflicting EPEL/Fedora puppet package
  become: true
  ansible.builtin.dnf:
    name: puppet
    state: absent
  when: foreman_stray_puppet_pkg.rc == 0

- name: preflight - check /var/lib/pulp available space
  become: false
  ansible.builtin.shell:
    cmd: df -BG --output=avail /var/lib/pulp 2>/dev/null || df -BG --output=avail /var
  register: foreman_pulp_space
  changed_when: false
  failed_when: false

- name: preflight - check /var/lib/containers available space
  become: false
  ansible.builtin.shell:
    cmd: df -BG --output=avail /var/lib/containers 2>/dev/null || df -BG --output=avail /var
  register: foreman_containers_space
  changed_when: false
  failed_when: false

- name: preflight - check /var/lib/pgsql available space
  become: false
  ansible.builtin.shell:
    cmd: df -BG --output=avail /var/lib/pgsql 2>/dev/null || df -BG --output=avail /var
  register: foreman_pgsql_space
  changed_when: false
  failed_when: false

# A Katello install onto an undersized /var fails partway through and leaves
# a half-configured system, so stop here instead. Thresholds sit below the
# recommended LV sizes to absorb filesystem overhead (defaults/main.yml).
# Override with foreman_skip_storage_check: true if the sizing is intentional.
- name: preflight - fail if storage is below recommended minimums
  become: false
  ansible.builtin.fail:
    msg: >
      Storage below recommended minimum.
      /var/lib/pulp: {{ foreman_pulp_space.stdout_lines[-1] | trim }} available (need {{ foreman_storage_min_pulp_gb }}G).
      /var/lib/containers: {{ foreman_containers_space.stdout_lines[-1] | trim }} available (need {{ foreman_storage_min_containers_gb }}G).
      /var/lib/pgsql: {{ foreman_pgsql_space.stdout_lines[-1] | trim }} available (need {{ foreman_storage_min_pgsql_gb }}G).
      Run 'make storage' before 'make install', or set
      foreman_skip_storage_check: true to proceed anyway.
  when:
    - not foreman_skip_storage_check | bool
    - >
      (foreman_pulp_space.stdout_lines[-1] | trim | regex_replace('G','') | int) < foreman_storage_min_pulp_gb or
      (foreman_containers_space.stdout_lines[-1] | trim | regex_replace('G','') | int) < foreman_storage_min_containers_gb or
      (foreman_pgsql_space.stdout_lines[-1] | trim | regex_replace('G','') | int) < foreman_storage_min_pgsql_gb
