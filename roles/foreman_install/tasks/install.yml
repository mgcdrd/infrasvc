---
# Gate on a marker written only after a fully successful installer run.
# /etc/foreman/settings.yaml is unsuitable: it appears even when the
# installer fails partway, which made failed installs unrecoverable
# (re-runs skipped the installer forever).
- name: install - check for previous successful installer run
  become: true
  ansible.builtin.stat:
    path: /root/.foreman-installer-success
  register: foreman_settings_stat

- name: install - write installer script
  become: true
  ansible.builtin.template:
    src: foreman-installer.sh.j2
    dest: /root/foreman-installer.sh
    owner: root
    group: root
    mode: "0700"

# Renewal hook target — acme.sh's reloadcmd calls this after
# complete-le-chain.sh so renewed certs propagate into Katello.
- name: install - write cert renewal script
  become: true
  ansible.builtin.template:
    src: foreman-cert-renewal.sh.j2
    dest: /usr/local/sbin/foreman-cert-renewal.sh
    owner: root
    group: root
    mode: "0700"
  when: foreman_custom_certs | bool

# Exec-allowed JVM tmpdir — /tmp is noexec on hardened hosts, which
# crashes puppetserver's JRuby native-lib extraction. The puppet user
# exists once packages.yml has installed openvox-server.
- name: install - create puppetserver JVM tmpdir
  become: true
  ansible.builtin.file:
    path: "{{ foreman_puppetserver_tmpdir }}"
    state: directory
    owner: puppet
    group: puppet
    mode: "0750"
  when: foreman_puppetserver_tmpdir | length > 0

# The tuning pre_commit hook enforces minimum memory per profile.
# When foreman_installer_skip_checks is true (undersized lab VMs), zero
# the memory requirement so the hook passes, then restore it in always:.
- name: install - installer block with tuning hook management
  when: not foreman_settings_stat.stat.exists
  block:
    - name: install - back up tuning hook
      become: true
      ansible.builtin.copy:
        src: /usr/share/foreman-installer/hooks/pre_commit/13-tuning.rb
        dest: /usr/share/foreman-installer/hooks/pre_commit/13-tuning.rb.bak
        remote_src: true
      when: foreman_installer_skip_checks | default(false) | bool

    - name: install - disable tuning memory check
      become: true
      ansible.builtin.replace:
        path: /usr/share/foreman-installer/hooks/pre_commit/13-tuning.rb
        regexp: "'development' => \\{ cpu_cores: \\d+, memory: \\d+ \\}"
        replace: "'development' => { cpu_cores: 1, memory: 0 }"
      when: foreman_installer_skip_checks | default(false) | bool

    # rc=6 (Puppet resources failed) is a real failure — historically it was
    # the smart proxy self-registration breaking, not a transient issue.
    # Failing here leaves the marker absent so a re-run retries the installer.
    - name: install - run foreman-installer
      become: true
      ansible.builtin.shell:
        cmd: /root/foreman-installer.sh
      register: foreman_installer_result
      changed_when: "'Success!' in foreman_installer_result.stdout"
      async: 7200
      poll: 30
      notify: restart sssd

    - name: install - record successful installer run
      become: true
      ansible.builtin.copy:
        content: "installed {{ ansible_date_time.iso8601 }}\n"
        dest: /root/.foreman-installer-success
        owner: root
        group: root
        mode: "0600"

  always:
    - name: install - restore tuning hook
      become: true
      ansible.builtin.copy:
        src: /usr/share/foreman-installer/hooks/pre_commit/13-tuning.rb.bak
        dest: /usr/share/foreman-installer/hooks/pre_commit/13-tuning.rb
        remote_src: true
        force: true
      failed_when: false
      when: foreman_installer_skip_checks | default(false) | bool

- name: install - enable and start foreman services
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - foreman
    - foreman-proxy
