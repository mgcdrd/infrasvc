---
- name: ipa - check for existing keytab
  become: true
  ansible.builtin.stat:
    path: /etc/foreman-proxy/freeipa.keytab
  register: foreman_keytab_stat

# Use the host's own keytab for the HTTP service principal — hosts can manage
# services for themselves without needing Service Administrator privileges.
# The HTTP/ principal is needed by --foreman-ipa-authentication (web SSO);
# the installer retrieves its keytab itself, so we must NOT fetch it here
# (ipa-getkeytab rotates the key, invalidating any other copy).
- name: ipa - obtain host Kerberos ticket
  become: true
  ansible.builtin.shell:
    cmd: "kinit -k -t /etc/krb5.keytab host/{{ foreman_hostname }}"
  when: not foreman_keytab_stat.stat.exists

- name: ipa - create HTTP service principal in IPA
  become: true
  ansible.builtin.shell:
    cmd: >
      ipa service-show HTTP/{{ foreman_hostname }} 2>/dev/null ||
      ipa service-add HTTP/{{ foreman_hostname }}
  when: not foreman_keytab_stat.stat.exists
  register: _ipa_service_add
  changed_when: "'Added service' in _ipa_service_add.stdout"

# The realm smart proxy authenticates as foreman_realm_principal, so the
# keytab must belong to that principal. IPA lets any user retrieve their
# OWN keytab by default (no admin/delegated privilege needed) — kinit as
# the realm principal itself rather than borrowing an admin account's
# rights, which the enrollment account (vault_ipa_admin_user) deliberately
# doesn't have. The account must already exist in IPA with a role granting
# host-management privileges (equivalent to foreman-prepare-realm's
# realm-proxy user) and a password set (vault_foreman_realm_agent_password).
- name: ipa - obtain realm principal Kerberos ticket
  become: true
  ansible.builtin.shell:
    cmd: "kinit {{ foreman_realm_principal.split('@') | first }}"
    stdin: "{{ vault_foreman_realm_agent_password }}"
  when: not foreman_keytab_stat.stat.exists
  no_log: true

- name: ipa - ensure /etc/foreman-proxy directory exists
  become: true
  ansible.builtin.file:
    path: /etc/foreman-proxy
    state: directory
    mode: "0755"
  when: not foreman_keytab_stat.stat.exists

# Note: this rotates the principal's Kerberos key — safe because the
# account is dedicated to the realm proxy and this only runs when the
# keytab is absent. It also invalidates vault_foreman_realm_agent_password
# as a side effect (self-service ipa-getkeytab can only generate a new
# random key, not retrieve the current one — -r needs elevated privilege
# this account deliberately doesn't have). See the role README for what
# that means for rebuilds.
- name: ipa - retrieve realm principal keytab for foreman-proxy
  become: true
  ansible.builtin.shell:
    cmd: >
      ipa-getkeytab
      -s {{ foreman_ipa_controller }}
      -p {{ foreman_realm_principal }}
      -k /etc/foreman-proxy/freeipa.keytab
  when: not foreman_keytab_stat.stat.exists

# Rotate vault_foreman_realm_agent_password to match the key ipa-getkeytab
# just generated, so the next full rebuild doesn't hit a stale password.
# Requires vault_ipa_admin_user to hold an IPA role scoped to change only
# foreman_realm_principal's password (see README) — opt in per-deployment
# via foreman_realm_vault_rotate, since not every deployment wants the
# role writing to Vault.
- name: ipa - generate new realm principal password
  ansible.builtin.set_fact:
    _foreman_realm_new_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_lowercase,ascii_uppercase,digits') }}"
  when: not foreman_keytab_stat.stat.exists and foreman_realm_vault_rotate | bool
  no_log: true

- name: ipa - obtain admin Kerberos ticket
  become: true
  ansible.builtin.shell:
    cmd: "kinit {{ vault_ipa_admin_user }}"
    stdin: "{{ vault_ipa_admin_password }}"
  when: not foreman_keytab_stat.stat.exists and foreman_realm_vault_rotate | bool
  no_log: true

# An admin-driven reset (unlike self-service change) marks the account
# "must change password at next login" by forcing krbPasswordExpiration to
# now — a non-interactive kinit can't respond to that forced prompt, so the
# very next automated kinit fails even with the right password. IPA's
# password-policy plugin reasserts that forced expiration unconditionally
# on any modify that changes userPassword, even one that sets
# krbPasswordExpiration in the very same call — so it must be cleared in a
# separate, subsequent modify (unlike ipa_baseline's user_add case, where
# setting both in one call works because there's no prior password to
# trigger the policy).
- name: ipa - reset realm principal password as admin
  become: true
  ansible.builtin.shell:
    cmd: "ipa user-mod {{ foreman_realm_principal.split('@') | first }} --password"
    stdin: "{{ _foreman_realm_new_password }}\n{{ _foreman_realm_new_password }}\n"
  when: not foreman_keytab_stat.stat.exists and foreman_realm_vault_rotate | bool
  no_log: true

- name: ipa - clear forced password expiration on realm principal
  become: true
  ansible.builtin.shell:
    cmd: >
      ipa user-mod {{ foreman_realm_principal.split('@') | first }}
      --setattr krbPasswordExpiration=20491231235959Z
  when: not foreman_keytab_stat.stat.exists and foreman_realm_vault_rotate | bool

# auth_method/role_id/secret_id are passed explicitly because these are
# community.hashi_vault *modules*, not lookup plugins — only lookup plugins
# get the declarative ANSIBLE_HASHI_VAULT_* env-var fallback, so without
# this a module task silently falls back to auth_method=token (VAULT_TOKEN/
# ~/.vault-token only) and can never authenticate via the ansible AppRole.
# Mirrors exactly what the lookup plugin does automatically. See
# VAULT_SETUP.md's "gotchas" section.
- name: ipa - read current Foreman secret from Vault
  community.hashi_vault.vault_kv2_get:
    url: "{{ foreman_realm_vault_addr }}"
    engine_mount_point: "{{ foreman_realm_vault_kv_mount }}"
    path: "{{ foreman_realm_vault_path }}"
    auth_method: "{{ lookup('env', 'ANSIBLE_HASHI_VAULT_AUTH_METHOD') or 'token' }}"
    role_id: "{{ lookup('env', 'ANSIBLE_HASHI_VAULT_ROLE_ID') or omit }}"
    secret_id: "{{ lookup('env', 'ANSIBLE_HASHI_VAULT_SECRET_ID') or omit }}"
  register: _foreman_realm_vault_secret
  delegate_to: localhost
  become: false
  when: not foreman_keytab_stat.stat.exists and foreman_realm_vault_rotate | bool
  no_log: true

- name: ipa - write rotated realm principal password to Vault
  community.hashi_vault.vault_kv2_write:
    url: "{{ foreman_realm_vault_addr }}"
    engine_mount_point: "{{ foreman_realm_vault_kv_mount }}"
    path: "{{ foreman_realm_vault_path }}"
    data: "{{ _foreman_realm_vault_secret.secret | combine({foreman_realm_vault_password_key: _foreman_realm_new_password}) }}"
    auth_method: "{{ lookup('env', 'ANSIBLE_HASHI_VAULT_AUTH_METHOD') or 'token' }}"
    role_id: "{{ lookup('env', 'ANSIBLE_HASHI_VAULT_ROLE_ID') or omit }}"
    secret_id: "{{ lookup('env', 'ANSIBLE_HASHI_VAULT_SECRET_ID') or omit }}"
  delegate_to: localhost
  become: false
  when: not foreman_keytab_stat.stat.exists and foreman_realm_vault_rotate | bool
  no_log: true

- name: ipa - destroy Kerberos ticket cache
  become: true
  ansible.builtin.shell:
    cmd: kdestroy -A
  when: not foreman_keytab_stat.stat.exists

- name: ipa - set keytab ownership
  become: true
  ansible.builtin.file:
    path: /etc/foreman-proxy/freeipa.keytab
    owner: foreman-proxy
    group: foreman-proxy
    mode: "0640"
