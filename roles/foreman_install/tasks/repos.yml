---
- name: repos - add Foreman GPG key
  ansible.builtin.rpm_key:
    key: "https://yum.theforeman.org/releases/{{ foreman_version }}/RPM-GPG-KEY-foreman"
    state: present

- name: repos - add Katello GPG key
  ansible.builtin.rpm_key:
    key: "https://theforeman.org/static/keys/1204513861C597FE74FA7009738B00A28CBDB523.pub"
    state: present

- name: repos - install Foreman release RPM
  ansible.builtin.dnf:
    name: "https://yum.theforeman.org/releases/{{ foreman_version }}/el9/x86_64/foreman-release.rpm"
    state: present

- name: repos - install Katello release RPM
  ansible.builtin.dnf:
    name: "https://yum.theforeman.org/katello/{{ foreman_katello_version }}/katello/el9/x86_64/katello-repos-latest.rpm"
    state: present

# Without this key the dnf module refuses the release RPM outright
# ("Can not load RPM file") — it enforces GPG checks on URL installs.
- name: repos - add OpenVox GPG key
  ansible.builtin.rpm_key:
    key: "https://yum.voxpupuli.org/GPG-KEY-openvox.pub"
    state: present

- name: repos - install OpenVox release RPM
  ansible.builtin.dnf:
    name: "https://yum.voxpupuli.org/{{ foreman_puppet_release }}-release-el-9.noarch.rpm"
    state: present

- name: repos - full system update
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
