---
foreman_version: "3.19"
foreman_katello_version: "4.21"
foreman_puppet_release: "openvox8"

foreman_installer_scenario: katello

# Preflight fails when /var/lib/{pulp,containers,pgsql} are undersized;
# set true to proceed anyway (e.g. intentionally small lab boxes).
foreman_skip_storage_check: false

# Minimum available GB per mount. Set below the recommended LV sizes
# (300/40/30) to allow for filesystem overhead — a fresh 300G xfs
# reports ~298G available.
foreman_storage_min_pulp_gb: 290
foreman_storage_min_containers_gb: 28
foreman_storage_min_pgsql_gb: 18

foreman_hostname: "{{ ansible_fqdn }}"
foreman_url: "https://{{ foreman_hostname }}"

# Org and location are required — set in group_vars
foreman_org: "My Organization"
foreman_location: "Default Location"

# ---- Installer: enable lists ----
# hammer CLI subcommands
foreman_installer_cli_enable:
  - ansible
  - discovery
  - openscap
  - puppet
  - tasks
  - templates

# Foreman plugins
foreman_installer_plugin_enable:
  - ansible
  - bootdisk
  - discovery
  - openscap
  - proxmox
  - puppet
  - remote-execution
  - templates
  - vault

# Smart Proxy plugins
foreman_installer_proxy_plugin_enable:
  - ansible
  - discovery
  - openscap
  - remote-execution-script

# Additional packages (--enable-<item>)
foreman_installer_further_enable:
  - puppet

# ---- DHCP ----
foreman_dhcp_enable: false
foreman_dhcp_provider: isc
foreman_dhcp_interface: eth0
foreman_dhcp_gateway: ""
foreman_dhcp_range_start: ""
foreman_dhcp_range_end: ""
foreman_dhcp_nameservers: []

# ---- DNS ----
foreman_dns_enable: false
foreman_dns_provider: powerdns        # powerdns or nsupdate
foreman_dns_forwarders: []
foreman_pdns_api_url: "http://localhost:8081"
# vault_pdns_api_key required when foreman_dns_provider: powerdns
foreman_dns_nsupdate_server: ""       # required when foreman_dns_provider: nsupdate

# ---- TFTP ----
foreman_tftp_enable: true
foreman_tftp_listen_on: https

# Smart proxy template URL (--foreman-proxy-template-url). Leave "" to use
# the installer default (the proxy's own hostname/port).
foreman_proxy_template_url: ""

# ---- Realm / IPA ----
foreman_realm_enable: false
foreman_realm_pam_server: foreman
foreman_realm_ipa_authentication: "true"
foreman_realm_ipa_authentication_api: "false"
foreman_realm_proxy: "true"
foreman_realm_provider: freeipa
foreman_realm_principal: ""
foreman_realm_freeipa_remove_dns: "false"
foreman_ipa_controller: ""

# ipa-getkeytab (see ipa.yml) rotates the realm principal's Kerberos key on
# every keytab fetch, invalidating whatever password is stored in Vault.
# Enabling this has the role reset the principal's password afterward
# (via vault_ipa_admin_user, which must hold a role scoped to change only
# this one account's password) and write the new value back to Vault
# itself, so the next full rebuild doesn't need a manual password reset.
foreman_realm_vault_rotate: false
foreman_realm_vault_addr: ""
foreman_realm_vault_kv_mount: ""
foreman_realm_vault_path: ""
foreman_realm_vault_password_key: "realm_agent_password"

# ---- Puppet / OpenVox ----
foreman_puppet_autosign_entries: "[*.example.com]"

# JVM tmpdir for puppetserver. On hardened hosts /tmp is noexec, which
# breaks JRuby's native-lib extraction ("Failed to load feature test for
# posix: can't find user for 0"). Set "" to skip and use the JVM default.
foreman_puppetserver_tmpdir: /opt/puppetlabs/server/data/puppetserver/tmp

# ---- Pulp content types ----
foreman_proxy_content_enable_ansible: true
foreman_proxy_content_enable_deb: true
foreman_proxy_content_enable_docker: false
foreman_proxy_content_enable_file: true
foreman_proxy_content_enable_ostree: true
foreman_proxy_content_enable_python: true
foreman_proxy_content_enable_yum: true
foreman_proxy_content_pulpcore_mirror: false

# ---- OpenSCAP proxy ----
foreman_proxy_openscap_ansible_module: true

# ---- Remote Execution Script ----
foreman_proxy_rex_script_enabled: true
foreman_proxy_rex_script_cockpit_integration: false

# ---- Tasks plugin ----
foreman_plugin_tasks_automatic_cleanup: true
foreman_plugin_tasks_backup: true

# ---- Internal cert customization ----
foreman_certs_city: Raleigh
foreman_certs_country: US
foreman_certs_org: "My Organization"
foreman_certs_org_unit: IT
foreman_certs_state: NC

# ---- Custom web certificates ----
# Set foreman_custom_certs: true and populate paths to replace the self-signed cert
foreman_custom_certs: false
foreman_cert_path: "/etc/ssl/acme/{{ foreman_hostname }}/cert.pem"
foreman_cert_key_path: "/etc/ssl/acme/{{ foreman_hostname }}/key.pem"
foreman_cert_ca_path: "/etc/ssl/acme/{{ foreman_hostname }}/ca.pem"

# ---- Telemetry ----
foreman_telemetry_logger_enabled: false
foreman_telemetry_prometheus_enabled: false
foreman_telemetry_statsd_enabled: false
