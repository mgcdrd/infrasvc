---
# Shared molecule defaults for every role scenario in this collection.
# Point molecule at it with MOLECULE_BASE_CONFIG (the Makefile does this).
# Per-scenario molecule.yml only needs to declare `platforms`.

dependency:
  name: galaxy

driver:
  name: docker

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      callbacks_enabled: profile_tasks
      stdout_callback: yaml

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
